<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff8f0"><title>今天吃什么 · 六选一</title>
<style>
:root{--ink:#282637;--muted:#797689;--bg:#fff8f0;--purple:#7254d8;--line:#e9e4eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(ellipse at top left,#fff1dd 0,transparent 55%),radial-gradient(ellipse at top right,#f1e8ff 0,transparent 55%),var(--bg);min-height:100vh}main{max-width:760px;margin:0 auto;padding:28px 17px 70px}.tag{font-size:11px;font-weight:800;letter-spacing:4px;color:#9779bd;text-align:center}h1{text-align:center;font-size:clamp(30px,7vw,43px);margin:10px 0 8px;letter-spacing:-1px}p.sub{text-align:center;margin:0 0 25px;color:var(--muted);font-size:14px}.panel{background:rgba(255,255,255,.89);box-shadow:0 12px 35px #6a467414;border:1px solid #fff;border-radius:25px;padding:22px;margin-bottom:16px}.name-line{display:flex;gap:10px;align-items:center;margin-bottom:18px}.name-line label{white-space:nowrap;font-weight:700}.name-line input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;outline-color:var(--purple);min-width:0}.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.food{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:102px;border-radius:16px;border:2px solid transparent;transition:transform .13s,border .13s;gap:7px}.food .emoji{font-size:29px}.food .label{font-size:14px;font-weight:800}.food.active{border-color:#8c6ee8;transform:scale(1.045);box-shadow:0 5px 16px #745bba30}.food:nth-child(1){background:#fff0e7}.food:nth-child(2){background:#e7f9ee}.food:nth-child(3){background:#ffeaf0}.food:nth-child(4){background:#fff6de}.food:nth-child(5){background:#ecf6ff}.food:nth-child(6){background:#f1eafa}.draw{margin-top:17px;display:block;width:100%;border:0;border-radius:16px;padding:17px;background:linear-gradient(100deg,#8b6bf1,#6a4dcf);color:#fff;font-size:18px;font-weight:900;box-shadow:0 7px 17px #6e54cc43;cursor:pointer}.draw:disabled{opacity:.6;cursor:wait}.result{margin:16px auto 0;text-align:center;font-weight:800;min-height:26px;color:#7653cf;font-size:19px}.status{text-align:center;font-size:13px;min-height:21px;color:var(--muted);margin-top:9px}.status.error{color:#c53654}.section-head{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:15px}.section-head h2{font-size:18px;margin:0}.section-head button{background:#f4f0fb;border:0;border-radius:9px;padding:9px 11px;color:#684fc7;font-weight:700;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.metric{background:#f7f3fc;padding:13px 6px;border-radius:13px;text-align:center}.metric strong{display:block;font-size:23px}.metric span{font-size:11px;color:var(--muted)}.chart-item{display:grid;grid-template-columns:85px 1fr 36px;align-items:center;gap:8px;font-size:13px;margin:10px 0}.bar{height:10px;border-radius:8px;background:#f1edf6;overflow:hidden}.bar i{display:block;background:linear-gradient(90deg,#c3b2fa,#7658dc);height:100%;border-radius:8px;min-width:0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:11px 5px;border-bottom:1px solid #f2edf2}th{color:var(--muted);font-weight:600}td:last-child,th:last-child{text-align:right} .empty{text-align:center;color:var(--muted);padding:22px 0;font-size:13px}.note{text-align:center;color:#98919f;font-size:12px;line-height:1.7;margin-top:14px}.scroll{overflow:auto} @media(max-width:380px){.panel{padding:16px}.food{min-height:89px}.food .label{font-size:12px}.chart-item{grid-template-columns:78px 1fr 30px}}
</style></head><body><main><div class="tag">LUCKY PICKER · SHARED</div><h1>🍽️ 今天吃什么？</h1><p class="sub">六选一 · 大家的选择，共同记录</p>
<section class="panel"><div class="name-line"><label for="nickname">🙋 我是</label><input id="nickname" maxlength="20" autocomplete="nickname" placeholder="输入你的昵称（所有人都能看到）"></div><div class="foods" id="foods"></div><button class="draw" id="drawBtn">🎲 开始随机抽取</button><div class="result" id="result" aria-live="polite"></div><div class="status" id="status" aria-live="polite"></div></section>
<section class="panel"><div class="section-head"><h2>📊 全员统计</h2><button id="refreshBtn">↻ 刷新</button></div><div class="metrics"><div class="metric"><strong id="total">—</strong><span>累计抽取</span></div><div class="metric"><strong id="people">—</strong><span>参与昵称数</span></div><div class="metric"><strong id="mine">—</strong><span>我的抽取</span></div></div><div id="chart"></div></section>
<section class="panel"><div class="section-head"><h2>🏆 抽取排行榜</h2></div><div class="scroll"><table><thead><tr><th>排名</th><th>昵称</th><th>抽取次数</th></tr></thead><tbody id="rank"></tbody></table></div></section>
<section class="panel"><div class="section-head"><h2>🕘 最近 50 条记录</h2></div><div class="scroll"><table><thead><tr><th>抽取人</th><th>抽中</th><th>时间</th></tr></thead><tbody id="history"></tbody></table></div></section><p class="note">共享记录会保存在 Supabase；页面约每 20 秒自动同步。<br>昵称不是实名身份，同名统计会合并，请不要填写个人敏感信息。</p></main>
<script>
(function(){'use strict';
const foods=[['炮兵','🍜'],['米村','🍚'],['香锅','🌶️'],['🐔','🐔'],['饺子','🥟'],['牛筋煲','🍲']];const byId=id=>document.getElementById(id);
// 所有数据请求改走本站 Netlify Function，不再让浏览器直连 Supabase。
const client={
 from:()=>({select:()=>({order:()=>({range:async(start,end)=>{
  try{const r=await fetch('/.netlify/functions/draws?offset='+start+'&limit='+(end-start+1),{cache:'no-store'});const j=await r.json();return r.ok?{data:j.records,error:null}:{data:null,error:new Error(j.error||'查询失败（HTTP '+r.status+'）')};}
  catch(e){return {data:null,error:e}}
 }})})}),
 rpc:async(_name,args)=>{
  try{const r=await fetch('/.netlify/functions/draws',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:args.p_nickname,clientId:args.p_client_id})});const j=await r.json();return r.ok?{data:j.record,error:null}:{data:null,error:new Error(j.error||'抽取失败（HTTP '+r.status+'）')};}
  catch(e){return {data:null,error:e}}
 }
};
let deviceId=localStorage.getItem('picker_device_id');if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{let r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});localStorage.setItem('picker_device_id',deviceId)}
byId('nickname').value=localStorage.getItem('picker_nickname')||'';
let busy=false;let lastDraw=0;const counts=Object.fromEntries(foods.map(x=>[x[0],0]));
foods.forEach(([label,emoji],i)=>{let div=document.createElement('div');div.className='food';div.innerHTML='<span class="emoji"></span><span class="label"></span>';div.querySelector('.emoji').textContent=emoji;div.querySelector('.label').textContent=label;div.id='food'+i;byId('foods').appendChild(div)});
function highlight(index){foods.forEach((_,i)=>byId('food'+i).classList.toggle('active',i===index))}
function status(msg,isError=false){let el=byId('status');el.textContent=msg;el.classList.toggle('error',isError)}
function cell(tr,value){let td=document.createElement('td');td.textContent=String(value);tr.appendChild(td)}
function row(tbody,values){let tr=document.createElement('tr');values.forEach(v=>cell(tr,v));tbody.appendChild(tr)}
function msgRow(tbody,message){tbody.replaceChildren();let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.className='empty';td.textContent=message;tr.appendChild(td);tbody.appendChild(tr)}
function timeFormat(iso){return new Date(iso).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
async function refresh(){
 try{
 // 分页读取全量记录以保证统计准确（适合小群；数据量很大时应改用数据库聚合视图）。
 let records=[],offset=0;while(true){const {data,error}=await client.from('food_draws').select('id,nickname,food,created_at').order('id',{ascending:false}).range(offset,offset+999);if(error)throw error;records.push(...data);if(data.length<1000)break;offset+=1000;if(offset>=10000){status('超过一万条记录：当前统计仅覆盖最新一万条');break}}
 let rank=new Map();for(const k of Object.keys(counts))counts[k]=0;
 records.forEach(x=>{counts[x.food]=(counts[x.food]||0)+1;rank.set(x.nickname,(rank.get(x.nickname)||0)+1)});
 byId('total').textContent=records.length>=10000?'10000+':records.length;byId('people').textContent=rank.size;byId('mine').textContent=rank.get(byId('nickname').value.trim())||0;
 const biggest=Math.max(1,...Object.values(counts));byId('chart').replaceChildren();foods.forEach(([name,emoji])=>{let item=document.createElement('div');item.className='chart-item';let label=document.createElement('span');label.textContent=emoji+' '+name;let bar=document.createElement('div');bar.className='bar';let inner=document.createElement('i');inner.style.width=(counts[name]/biggest*100)+'%';bar.appendChild(inner);let n=document.createElement('b');n.textContent=counts[name];item.append(label,bar,n);byId('chart').appendChild(item)});
 byId('rank').replaceChildren();let sorted=[...rank.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));sorted.slice(0,30).forEach(([name,num],i)=>row(byId('rank'),[(i+1)+'',name,num]));if(!sorted.length)msgRow(byId('rank'),'还没有人参与，快来抽第一签！');
 byId('history').replaceChildren();records.slice(0,50).forEach(x=>row(byId('history'),[x.nickname,x.food,timeFormat(x.created_at)]));if(!records.length)msgRow(byId('history'),'暂无记录');status('已同步 · '+new Date().toLocaleTimeString('zh-CN'));
 }catch(err){status('同步失败：'+(err.message||String(err)),true)} }
byId('nickname').addEventListener('input',e=>{localStorage.setItem('picker_nickname',e.target.value);});byId('nickname').addEventListener('change',()=>refresh());
byId('drawBtn').addEventListener('click',async()=>{if(busy)return;let name=byId('nickname').value.trim();if(!name){status('请先输入昵称',true);byId('nickname').focus();return}if(Date.now()-lastDraw<3100){status('请隔 3 秒再抽',true);return}busy=true;byId('drawBtn').disabled=true;byId('result').textContent='命运正在决定中…';status('正在抽取并写入全员记录');let ticker=setInterval(()=>highlight(Math.floor(Math.random()*6)),100);
 try{const {data,error}=await client.rpc('make_food_draw',{p_nickname:name,p_client_id:deviceId});if(error)throw error;const saved=Array.isArray(data)?data[0]:data;if(!saved||!saved.food)throw new Error('数据库未返回结果');lastDraw=Date.now();clearInterval(ticker);ticker=null;highlight(foods.findIndex(x=>x[0]===saved.food));byId('result').textContent='🎉 '+name+'，今天就吃 '+saved.food+'！';await refresh();}catch(err){byId('result').textContent='未完成抽取';status(err.message||String(err),true)}finally{if(ticker)clearInterval(ticker);busy=false;byId('drawBtn').disabled=false}});
byId('refreshBtn').addEventListener('click',refresh);refresh();setInterval(()=>{if(!busy&&!document.hidden)refresh()},20000);
})();
</script></body></html>
